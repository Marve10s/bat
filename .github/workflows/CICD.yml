name: Emoji wrapping proof
on:
  push:
    branches:
      - 'verify/emoji-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression_before:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove new regressions fail before the fix
        shell: bash
        run: |
          set +e
          cargo test --locked --test integration_tests unicode_emoji_ > regression-before.log 2>&1
          test_status=$?
          set -e
          cat regression-before.log
          test "$test_status" -eq 101
          grep -F 'test result: FAILED. 0 passed; 3 failed;' regression-before.log
      - uses: actions/upload-artifact@master
        if: always()
        with:
          name: emoji-regression-before
          path: regression-before.log
