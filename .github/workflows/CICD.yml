name: Emoji wrapping proof
on:
  push:
    branches:
      - 'verify/emoji-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification_after:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Formatting
        run: cargo fmt -- --check
      - name: Type check all targets and features
        run: cargo check --locked --all-targets --all-features
      - name: Lint all targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Full package tests
        run: cargo test --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --all-features
      - name: Build corrected executable
        run: cargo build --locked
      - uses: actions/upload-artifact@master
        with:
          name: emoji-corrected-bat
          path: target/debug/bat
